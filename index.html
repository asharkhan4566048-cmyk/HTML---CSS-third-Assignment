<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positivus Home Page</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="main-container">
        <nav class="navbar">
            <div class="logo-box">
                <img src="./9ec89bb0-d6ee-4f81-99c3-819c6eba39ec - .jpg" alt="logo">
            </div>
            <div class="list-btngroup">
                <ul class="menu-list">
                    <li class="list"><a href="#">About us</a></li>
                    <li class="list"><a href="#">Services</a></li>
                    <li class="list"><a href="#">Use Cases</a></li>
                    <li class="list"><a href="#">Pricing</a></li>
                    <li class="list"><a href="#">Blog</a></li>
                </ul>
                <button class="btn">Request a quote</button>
            </div>
        </nav>
        <div class="container">
            <div class="text-group">
                <h1 class="h1">Navigating the digital landscape for success</h1>
                <p class="para">
                    Our digital marketing agency helps businesses grow and suceed online
                    through a range of services including SEO, PPC, social media marketing,
                    and content creation
                </p>
                <button class="t-btn">Book a consultation</button>
            </div>
            <div class="image-box">
                <img src="./image1.png" alt="image">
            </div>
        </div>
        <div class="image-cont">
            <img src="./amazone .svg" alt="amazon-logo" class="am1">
            <img src="./dribble.svg" alt="dribbble-logo" class="dr1">
            <img src="./hubspot.svg" alt="hubspot" class="hu1">
            <img src="./notion.svg" alt="notion-logo" class="no1">
            <img src="./netflix.svg" alt="netflix-logo" class="net">
            <img src="./zoom.svg" alt="zoom-logo" class="zoom">
        </div>
    </div>

</html>
